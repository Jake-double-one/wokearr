# Weekly PRs for outdated dependencies, base image and GitHub Actions
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # requirements.txt pins the transitive packages as well - one PR for
    # all of them, not one per package
    groups:
      python-packages:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
