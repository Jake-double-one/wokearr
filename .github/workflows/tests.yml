name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes app tests
      - name: Tests
        run: python -m pytest -q

  dependency-audit:
    # Known vulnerabilities in the pinned packages - and in what they pull in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # pip/setuptools first: the runner's own copies are not Wokearr's concern
        run: |
          python -m pip install -U pip setuptools
          pip install -r requirements.txt pip-audit
      - name: Audit installed packages
        run: pip-audit --skip-editable
