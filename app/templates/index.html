<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wokearr</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">WA</span>
    <span class="brand-name">Wokearr</span>
  </div>
  <div class="topbar-actions">
    <span id="demo-flag" class="demo-flag" style="display:none">Demo-Modus – Plex nicht konfiguriert</span>
    <button id="btn-rebuild" class="btn btn-ghost">Cache aktualisieren</button>
    <button id="btn-rebuild-full" class="btn btn-ghost" title="Fragt alle Titel erneut ab (dauert deutlich länger)">Kompletter Neuaufbau</button>
    <button id="btn-cleanup-posters" class="btn btn-ghost" title="Löscht alte, selbst hochgeladene Poster-Versionen in Plex (Poster-Historie), die sich über die Zeit ansammeln">Alte Poster in Plex löschen</button>
    <button id="btn-apply-all" class="btn btn-primary">Alle anwenden</button>
  </div>
</header>

<nav class="filterbar">
  <button class="chip chip-active" data-filter="all">Alle <span class="count" id="count-all">0</span></button>
  <button class="chip" data-filter="red"><span class="dot dot-red"></span>Rot <span class="count" id="count-red">0</span></button>
  <button class="chip" data-filter="yellow"><span class="dot dot-yellow"></span>Gelb <span class="count" id="count-yellow">0</span></button>
  <button class="chip" data-filter="green"><span class="dot dot-green"></span>Grün <span class="count" id="count-green">0</span></button>
</nav>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty-state" class="empty-state" style="display:none">
    Keine Titel mit Woke-Score gefunden. Cache aktualisieren oder PLEX_URL/PLEX_TOKEN pruefen.
  </p>
</main>

<footer class="app-footer">
  Score-Daten von <a href="https://isitwokeornot.com/" target="_blank" rel="noopener noreferrer">isitwokeornot.com</a>
  &middot; kein offizielles Tool von isitwokeornot.com, Plex Inc. oder TMDb
</footer>

<div id="toast" class="toast" style="display:none">
  <div class="toast-bar"><div id="toast-bar-fill" class="toast-bar-fill"></div></div>
  <span id="toast-text">...</span>
</div>

<script>
  window.__DEMO__ = {{ demo | tojson }};
  window.__BADGE_LABEL_STYLE__ = {{ badge_label_style | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
