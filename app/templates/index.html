<!DOCTYPE html>
<html lang="{{ language[:2] }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wokearr</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  /* Band colors of the active palette (BADGE_COLOR_SCHEME), see band_styles() */
  :root {
  {%- for band in bands %}
    --band-{{ band | replace('_', '-') }}: {{ band_styles[band].color }};
    --band-{{ band | replace('_', '-') }}-text: {{ band_styles[band].text }};
  {%- endfor %}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">WA</span>
    <span class="brand-name">Wokearr</span>
  </div>
  <div class="topbar-actions">
    <span id="demo-flag" class="demo-flag" style="display:none">{{ t('topbar.demo_flag') }}</span>
    <div class="action-group">
      <button id="btn-rebuild" class="btn btn-ghost" title="{{ t('topbar.btn_rebuild.title') }}">{{ t('topbar.btn_rebuild.label') }}</button>
      <button id="btn-sync-library" class="btn btn-primary" title="{{ t('topbar.btn_sync_library.title') }}">{{ t('topbar.btn_sync_library.label') }}</button>
      <button id="btn-apply-all" class="btn btn-primary" title="{{ t('topbar.btn_apply_all.title') }}">{{ t('topbar.btn_apply_all.label') }}</button>
    </div>
    <div class="action-group action-group-secondary">
      <button id="btn-rebuild-full" class="btn btn-ghost btn-small" title="{{ t('topbar.btn_rebuild_full.title') }}">{{ t('topbar.btn_rebuild_full.label') }}</button>
      <button id="btn-cleanup-posters" class="btn btn-ghost btn-small" title="{{ t('topbar.btn_cleanup_posters.title') }}">{{ t('topbar.btn_cleanup_posters.label') }}</button>
    </div>
  </div>
</header>

<nav class="filterbar">
  <button class="chip chip-active" data-filter="all">{{ t('filter.all') }} <span class="count" id="count-all">0</span></button>
  {%- for band in bands %}
  <button class="chip" data-filter="{{ band }}" title="{{ 0 if loop.first else band_max[bands[loop.index0 - 1]] + 1 }}–{{ band_max[band] }}%">
    <span class="dot dot-{{ band | replace('_', '-') }}"></span>{{ t('filter.' ~ band) }} <span class="count" id="count-{{ band }}">0</span>
  </button>
  {%- endfor %}
  <div class="sort-control">
    <select id="sort-field" class="sort-field" aria-label="{{ t('sort.label') }}" title="{{ t('sort.label') }}">
      <option value="title">{{ t('sort.title') }}</option>
      <option value="score">{{ t('sort.score') }}</option>
      <option value="released">{{ t('sort.released') }}</option>
    </select>
    <button id="sort-dir" class="sort-dir" type="button">↑</button>
  </div>
</nav>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty-state" class="empty-state" style="display:none">
    {{ t('empty_state') }}
  </p>
</main>

<footer class="app-footer">
  <div class="status-bar">
    <button id="status-toggle" class="status-summary" aria-expanded="false" aria-controls="status-history">
      <span id="status-last-run">{{ t('status.never') }}</span>
    </button>
    <span class="status-next" id="status-next-run" hidden></span>
    <span class="status-version" id="status-version"></span>
  </div>
  <div id="status-history" class="status-history" hidden></div>
  <div class="footer-credits">
    {{ t('footer.source_prefix') }} <a href="https://isitwokeornot.com/" target="_blank" rel="noopener noreferrer">isitwokeornot.com</a>
    &middot; {{ t('footer.disclaimer') }}
  </div>
</footer>

<div id="toast" class="toast" style="display:none">
  <div class="toast-bar"><div id="toast-bar-fill" class="toast-bar-fill"></div></div>
  <span id="toast-text">...</span>
</div>

<script>
  window.__DEMO__ = {{ demo | tojson }};
  window.__BADGE_LABEL_STYLE__ = {{ badge_label_style | tojson }};
  window.__I18N__ = {{ i18n | tojson }};
  window.__LANGUAGE__ = {{ language | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
