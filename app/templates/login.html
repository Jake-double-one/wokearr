<!DOCTYPE html>
<html lang="{{ language[:2] }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Installed as a web app (home screen): dark status bar and splash screen
     instead of the white default, see manifest.json -->
<meta name="theme-color" content="#1c1e22">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wokearr">
<link rel="manifest" href="{{ static_url('manifest.json') }}">
<meta name="robots" content="noindex">
<title>{{ t('login.title') }} · Wokearr</title>
<link rel="icon" href="{{ static_url('favicon.ico') }}" sizes="32x32">
<link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ static_url('apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body class="login-page">

<main class="login-panel">
  <div class="login-brand">
    <img class="brand-logo" src="{{ static_url('favicon.svg') }}" alt="" width="34" height="34">
    <span class="brand-name">Wokearr</span>
  </div>

  <form class="login-form" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <label class="login-label" for="login-username">{{ t('login.username') }}</label>
    <input class="login-input" id="login-username" name="username" type="text" value="{{ username }}"
           autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label class="login-label" for="login-password">{{ t('login.password') }}</label>
    <input class="login-input" id="login-password" name="password" type="password"
           autocomplete="current-password" required>

    <label class="login-remember">
      <input type="checkbox" name="remember" value="1"> {{ t('login.remember') }}
    </label>

    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}

    <button class="btn btn-primary login-submit" type="submit">{{ t('login.submit') }}</button>
  </form>
</main>

</body>
</html>
