version: "3.8"

services:
  woke-score:
    # Fertiges Image aus der GitHub Action (.github/workflows/docker-publish.yml).
    # Fuer eine feste Version statt "latest" z.B. ":v0.1.0" verwenden.
    image: ghcr.io/jake-double-one/wokearr:latest
    # Alternative: selbst aus diesem Repo bauen (z.B. fuer eigene Anpassungen) -
    # dann die "image:"-Zeile oben entfernen/auskommentieren und stattdessen:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: woke-score
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      PLEX_URL: "${PLEX_URL:-}"
      PLEX_TOKEN: "${PLEX_TOKEN:-}"
      LIBRARY_SECTIONS: "${LIBRARY_SECTIONS:-Filme,Serien}"
      BADGE_POSITION: "${BADGE_POSITION:-top-right}"
      BADGE_LABEL_STYLE: "${BADGE_LABEL_STYLE:-percent}"
      AUTO_SYNC_INTERVAL_MINUTES: "${AUTO_SYNC_INTERVAL_MINUTES:-0}"
      CACHE_REBUILD_COOLDOWN_MINUTES: "${CACHE_REBUILD_COOLDOWN_MINUTES:-5}"
      CLEANUP_OLD_POSTERS: "${CLEANUP_OLD_POSTERS:-true}"
    volumes:
      - woke-score-data:/data

volumes:
  woke-score-data:
