version: "3.8"

services:
  wokearr:
    # Ready-built image from the GitHub Action (.github/workflows/docker-publish.yml).
    # Use a pinned version instead of "latest", e.g. ":v0.1.0".
    image: ghcr.io/jake-double-one/wokearr:latest
    # Alternative: build from this repo yourself (e.g. for your own changes) -
    # remove/comment out the "image:" line above and use this instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: wokearr
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      PLEX_URL: "${PLEX_URL:-}"
      PLEX_TOKEN: "${PLEX_TOKEN:-}"
      LIBRARY_SECTIONS: "${LIBRARY_SECTIONS:-Filme,Serien}"
      LANGUAGE: "${LANGUAGE:-en-US}"
      BADGE_POSITION: "${BADGE_POSITION:-top-right}"
      BADGE_LABEL_STYLE: "${BADGE_LABEL_STYLE:-percent}"
      BADGE_WIDTH_PERCENT: "${BADGE_WIDTH_PERCENT:-20}"
      BADGE_COLOR_SCHEME: "${BADGE_COLOR_SCHEME:-standard}"
      AUTO_SYNC_CRON: "${AUTO_SYNC_CRON:-}"
      CACHE_REBUILD_COOLDOWN_MINUTES: "${CACHE_REBUILD_COOLDOWN_MINUTES:-5}"
      RUN_HISTORY_RETENTION: "${RUN_HISTORY_RETENTION:-4w}"
      CLEANUP_OLD_POSTERS: "${CLEANUP_OLD_POSTERS:-true}"
    volumes:
      - woke-score-data:/data

volumes:
  woke-score-data:
